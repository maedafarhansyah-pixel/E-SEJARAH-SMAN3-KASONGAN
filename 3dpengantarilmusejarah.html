<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chrono — Prinsip Ilmu Sejarah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font:inherit;color:inherit;}
::selection{background:rgba(156,122,60,.24);color:#1c1814;}

/* ============ TOKENS ============ */
:root{
  --bg:#f8f4eb;
  --bg-2:#f2ede1;
  --bg-3:#ece5d5;
  --surface:#ffffff;
  --surface-2:#fdfbf6;
  --surface-3:#f5f0e3;

  --border:rgba(28,24,20,.07);
  --border-2:rgba(28,24,20,.13);
  --border-3:rgba(28,24,20,.24);

  --ink:#1c1814;
  --ink-2:#4d463f;
  --ink-3:#857d72;
  --ink-4:#b0a89c;
  --ink-5:#d4ccbc;

  --bronze:#9c7a3c;
  --bronze-2:#b89552;
  --bronze-deep:#7a5e2c;
  --bronze-tint:rgba(156,122,60,.06);
  --bronze-soft:rgba(156,122,60,.12);
  --bronze-glow:rgba(156,122,60,.24);

  --rose:#a8473c;
  --rose-tint:rgba(168,71,60,.06);
  --teal:#3d6b5f;
  --teal-tint:rgba(61,107,95,.06);
  --emerald:#3d6b4a;
  --emerald-tint:rgba(61,107,74,.06);

  --sans:'Inter Tight',system-ui,-apple-system,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono','SF Mono',monospace;

  --shadow-sm:0 1px 2px rgba(28,24,20,.04);
  --shadow:0 2px 8px rgba(28,24,20,.06);
  --shadow-lg:0 12px 32px rgba(28,24,20,.09);
  --shadow-xl:0 24px 60px rgba(28,24,20,.14);

  --ease:cubic-bezier(0.16,1,0.3,1);
}

/* ============ BASE ============ */
html,body{height:100%;}
body{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  color:var(--ink-2);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-feature-settings:'ss01','cv11';
  overflow:hidden;
}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(ellipse 90% 55% at 50% -15%, rgba(156,122,60,.09), transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 105%, rgba(156,122,60,.05), transparent 55%),
    radial-gradient(ellipse 60% 40% at -5% 85%, rgba(168,71,60,.03), transparent 50%);
}

.grain{
  position:fixed;inset:0;pointer-events:none;z-index:9999;
  opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' seed='5'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode:multiply;
}

/* ============ TYPOGRAPHY ============ */
h1,h2,h3,h4{color:var(--ink);font-weight:500;}
h1{
  font-family:var(--serif);
  font-size:clamp(44px,7.5vw,92px);
  line-height:.94;
  letter-spacing:-.045em;
  font-weight:350;
  font-variation-settings:'opsz' 144,'SOFT' 0,'WONK' 0;
}
h2{
  font-family:var(--serif);
  font-size:clamp(26px,3.6vw,40px);
  line-height:1.05;
  letter-spacing:-.03em;
  font-weight:400;
  font-variation-settings:'opsz' 96,'SOFT' 0,'WONK' 0;
}
h3{
  font-family:var(--serif);
  font-size:22px;
  line-height:1.25;
  letter-spacing:-.02em;
  font-weight:400;
  font-variation-settings:'opsz' 24,'SOFT' 0,'WONK' 0;
}
p{color:var(--ink-2);line-height:1.75;}
em{color:var(--bronze-deep);font-style:italic;}
strong,b{color:var(--ink);font-weight:600;}
a{color:var(--bronze-deep);text-decoration:none;}
a:hover{text-decoration:underline;text-decoration-color:var(--bronze);text-underline-offset:3px;}

/* ============ LAYOUT ============ */
.app{display:flex;height:100vh;overflow:hidden;}

/* ============ SIDEBAR ============ */
.sidebar{
  width:280px;flex-shrink:0;height:100vh;
  display:flex;flex-direction:column;
  background:var(--bg-2);
  border-right:1px solid var(--border);
  position:relative;z-index:30;
}

.brand{
  padding:32px 24px 28px;
  display:flex;align-items:center;gap:14px;
  border-bottom:1px solid var(--border);
}
.brand-mark{
  width:38px;height:38px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:22px;font-weight:500;
  color:var(--bg);
  background:var(--ink);
  border-radius:8px;
  font-variation-settings:'opsz' 96,'WONK' 1;
  letter-spacing:-.04em;
  box-shadow:
    0 1px 0 rgba(255,255,255,.15) inset,
    0 4px 12px rgba(28,24,20,.15);
}
.brand-name{
  font-family:var(--serif);font-size:20px;font-weight:400;
  color:var(--ink);letter-spacing:-.02em;line-height:1.1;
  font-variation-settings:'opsz' 24,'WONK' 0;
}
.brand-sub{
  display:block;font-family:var(--mono);
  font-size:9px;font-weight:500;
  color:var(--ink-4);letter-spacing:.14em;
  text-transform:uppercase;margin-top:4px;
}

.chapter-nav{
  flex:1;overflow-y:auto;
  padding:24px 16px;
  scrollbar-width:none;
}
.chapter-nav::-webkit-scrollbar{display:none;}

.nav-label{
  font-family:var(--mono);font-size:9.5px;font-weight:500;
  color:var(--ink-4);letter-spacing:.18em;text-transform:uppercase;
  padding:0 12px 14px;
}
.chapter-link{
  display:flex;align-items:center;gap:14px;
  width:100%;padding:11px 12px;
  border-radius:7px;text-align:left;
  color:var(--ink-3);position:relative;
  transition:all .25s var(--ease);
  margin-bottom:1px;
}
.chapter-link:hover{
  color:var(--ink-2);
  background:rgba(255,255,255,.5);
}
.chapter-link.active{
  color:var(--ink);
  background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.chapter-link.active::before{
  content:'';position:absolute;left:-16px;
  top:50%;transform:translateY(-50%);
  width:2px;height:18px;
  background:linear-gradient(180deg,var(--bronze),var(--bronze-deep));
  border-radius:0 2px 2px 0;
}
.chapter-num{
  font-family:var(--mono);font-size:10.5px;font-weight:400;
  color:var(--ink-4);min-width:20px;letter-spacing:.02em;
  transition:color .25s;
}
.chapter-link:hover .chapter-num,
.chapter-link.active .chapter-num{color:var(--bronze);}
.chapter-name{
  font-size:13px;font-weight:500;line-height:1.35;
  letter-spacing:-.005em;flex:1;
}
.chapter-check{
  font-family:var(--mono);font-size:9px;
  color:var(--bronze);opacity:0;transition:opacity .25s;
}
.chapter-link.visited .chapter-check{opacity:.7;}

.sidebar-foot{
  padding:20px 24px 24px;
  border-top:1px solid var(--border);
  background:rgba(248,244,235,.4);
}
.progress-label{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:9.5px;font-weight:500;
  color:var(--ink-4);letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:10px;
}
.progress-label span:last-child{color:var(--bronze);letter-spacing:.04em;}
.progress-track{
  height:2px;background:rgba(156,122,60,.12);
  border-radius:2px;overflow:hidden;margin-bottom:18px;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--bronze-deep),var(--bronze),var(--bronze-2));
  border-radius:2px;
  transition:width .7s var(--ease);
}
.side-controls{display:flex;gap:6px;}
.ctrl{
  flex:1;height:32px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--border-2);
  border-radius:6px;font-size:12px;color:var(--ink-3);
  transition:all .2s var(--ease);
}
.ctrl:hover{
  border-color:var(--border-3);color:var(--ink);
  background:rgba(255,255,255,.5);
}
.ctrl.active{
  background:var(--bronze-tint);border-color:var(--bronze);color:var(--bronze-deep);
}

/* ============ MAIN ============ */
.main{
  flex:1;height:100vh;overflow-y:auto;
  scroll-behavior:smooth;
  position:relative;
}
.main::-webkit-scrollbar{width:10px;}
.main::-webkit-scrollbar-track{background:transparent;}
.main::-webkit-scrollbar-thumb{
  background:rgba(28,24,20,.12);
  border-radius:5px;border:3px solid var(--bg);
}
.main::-webkit-scrollbar-thumb:hover{background:rgba(28,24,20,.24);}

.content{
  max-width:760px;margin:0 auto;
  padding:88px 56px 140px;
}

.content > *{
  animation:reveal .7s var(--ease) both;
}
.content > *:nth-child(1){animation-delay:0s;}
.content > *:nth-child(2){animation-delay:.06s;}
.content > *:nth-child(3){animation-delay:.12s;}
.content > *:nth-child(4){animation-delay:.18s;}
.content > *:nth-child(5){animation-delay:.24s;}
.content > *:nth-child(6){animation-delay:.30s;}
.content > *:nth-child(7){animation-delay:.36s;}
.content > *:nth-child(8){animation-delay:.42s;}

@keyframes reveal{
  from{opacity:0;transform:translateY(12px);filter:blur(3px);}
  to{opacity:1;transform:translateY(0);filter:blur(0);}
}

/* ============ HERO ============ */
.hero{margin-bottom:72px;}
.hero-eyebrow{
  display:flex;align-items:center;gap:14px;
  margin-bottom:28px;flex-wrap:wrap;
}
.hero-eyebrow-line{
  width:32px;height:1px;
  background:linear-gradient(90deg,transparent,var(--bronze),transparent);
  opacity:.5;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:999px;
  font-family:var(--mono);font-size:9.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--border-2);color:var(--bronze-deep);
  background:var(--bronze-tint);
}
.chip-gold{background:var(--bronze-tint);color:var(--bronze-deep);border-color:rgba(156,122,60,.25);}
.chip-rose{background:var(--rose-tint);color:var(--rose);border-color:rgba(168,71,60,.2);}
.chip-teal{background:var(--teal-tint);color:var(--teal);border-color:rgba(61,107,95,.2);}
.chip-emerald{background:var(--emerald-tint);color:var(--emerald);border-color:rgba(61,107,74,.2);}

.hero-meta{
  font-family:var(--mono);font-size:10px;
  color:var(--ink-4);letter-spacing:.16em;text-transform:uppercase;
}
.hero-title{
  margin-bottom:16px;
  color:var(--ink);
}
.hero-title .accent{
  font-style:italic;
  font-variation-settings:'opsz' 144,'SOFT' 100,'WONK' 1;
  color:var(--bronze-deep);
}
.hero-lede{
  font-family:var(--serif);font-size:clamp(19px,2.2vw,24px);
  line-height:1.45;color:var(--ink-2);font-style:italic;
  letter-spacing:-.01em;margin-bottom:24px;
  font-variation-settings:'opsz' 24,'SOFT' 0,'WONK' 0;
  font-weight:350;
}
.hero-quote{
  border-left:2px solid var(--bronze);
  padding:6px 0 6px 26px;
  margin:36px 0;
  font-family:var(--serif);font-style:italic;
  font-size:19px;line-height:1.55;
  color:var(--ink-2);font-weight:350;
  font-variation-settings:'opsz' 24,'SOFT' 0,'WONK' 0;
  position:relative;
}
.hero-quote::before{
  content:'';position:absolute;left:-2px;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--bronze) 0%,var(--bronze-deep) 40%,transparent 100%);
}
.hero-quote cite{
  display:block;margin-top:12px;
  font-family:var(--mono);font-style:normal;
  font-size:10px;color:var(--ink-4);
  letter-spacing:.16em;text-transform:uppercase;
}
.hero-body{
  font-size:16px;color:var(--ink-2);line-height:1.75;
  max-width:600px;font-weight:400;
}

/* ============ SECTION ============ */
.section{margin-bottom:64px;}
.section-header{
  display:flex;align-items:baseline;gap:20px;
  margin-bottom:16px;padding-bottom:16px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.section-header::after{
  content:'';position:absolute;bottom:-1px;left:0;
  width:40px;height:1px;background:var(--bronze);
}
.section-num{
  font-family:var(--serif);font-size:14px;font-weight:400;
  font-style:italic;color:var(--bronze);
  letter-spacing:.02em;flex-shrink:0;
  font-variation-settings:'opsz' 24,'SOFT' 0,'WONK' 1;
}
.section-title{
  font-family:var(--serif);font-size:clamp(23px,2.9vw,31px);
  font-weight:400;letter-spacing:-.025em;line-height:1.15;
  color:var(--ink);
  font-variation-settings:'opsz' 96,'SOFT' 0,'WONK' 0;
}
.section-desc{
  font-size:14.5px;color:var(--ink-3);
  line-height:1.7;margin:16px 0 28px;max-width:600px;
}

/* ============ COMPONENT CARDS ============ */
.comp-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;margin-top:24px;
}
.comp-card{
  position:relative;text-align:left;padding:24px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  transition:all .35s var(--ease);
  overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.comp-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at top left,rgba(156,122,60,.06),transparent 60%);
  opacity:0;transition:opacity .35s var(--ease);
  pointer-events:none;
}
.comp-card:hover{
  transform:translateY(-2px);
  border-color:var(--border-2);
  box-shadow:var(--shadow-lg);
}
.comp-card:hover::before{opacity:1;}
.comp-chip{
  display:inline-block;padding:2px 8px;
  font-family:var(--mono);font-size:9px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;
  border-radius:4px;margin-bottom:16px;
  color:var(--bronze-deep);background:var(--bronze-tint);
  border:1px solid rgba(156,122,60,.18);
}
.comp-title{
  font-family:var(--serif);font-size:17px;font-weight:400;
  color:var(--ink);margin-bottom:6px;line-height:1.25;
  letter-spacing:-.015em;
  font-variation-settings:'opsz' 24,'SOFT' 0,'WONK' 0;
}
.comp-desc{
  font-family:var(--mono);font-size:10px;
  color:var(--ink-4);letter-spacing:.06em;
  line-height:1.4;
}
.comp-arrow{
  position:absolute;right:20px;bottom:20px;
  font-size:14px;color:var(--ink-4);
  transition:all .3s var(--ease);
}
.comp-card:hover .comp-arrow{
  transform:translateX(4px);color:var(--bronze);
}

/* ============ INFO CARDS ============ */
.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:10px;margin-top:20px;
}
.info-card{
  text-align:left;padding:20px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  transition:all .3s var(--ease);
  display:flex;flex-direction:column;
  min-height:120px;position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.info-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at top left,var(--tint,rgba(156,122,60,.06)),transparent 55%);
  opacity:0;transition:opacity .3s var(--ease);
  pointer-events:none;
}
.info-card:hover{
  transform:translateY(-2px);
  border-color:var(--border-2);
  box-shadow:var(--shadow-lg);
}
.info-card:hover::before{opacity:1;}
.info-card .ic-eyebrow{
  font-family:var(--mono);font-size:9px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--bronze-deep);margin-bottom:12px;
}
.info-card .ic-icon{
  font-size:22px;margin-bottom:10px;line-height:1;
  filter:saturate(.85);
}
.info-card .ic-name{
  font-family:var(--serif);font-size:16px;font-weight:400;
  color:var(--ink);margin-bottom:6px;
  line-height:1.25;letter-spacing:-.015em;
  font-variation-settings:'opsz' 24,'SOFT' 0,'WONK' 0;
}
.info-card .ic-sub{
  font-size:12px;color:var(--ink-3);
  line-height:1.5;margin-top:auto;
}
.info-card.amber{--tint:rgba(156,122,60,.08);}
.info-card.teal{--tint:rgba(61,107,95,.08);}
.info-card.teal .ic-eyebrow{color:var(--teal);}
.info-card.rose{--tint:rgba(168,71,60,.08);}
.info-card.rose .ic-eyebrow{color:var(--rose);}
.info-card.emerald{--tint:rgba(61,107,74,.08);}
.info-card.emerald .ic-eyebrow{color:var(--emerald);}

/* ============ TABS ============ */
.tabs{
  display:flex;gap:2px;flex-wrap:wrap;
  margin:0 0 20px;padding:4px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:8px;width:fit-content;max-width:100%;
}
.tab-btn{
  padding:8px 16px;border-radius:6px;
  font-family:var(--mono);font-size:10px;font-weight:500;
  color:var(--ink-3);
  letter-spacing:.08em;text-transform:uppercase;
  transition:all .25s var(--ease);
  white-space:nowrap;
}
.tab-btn:hover{color:var(--ink-2);}
.tab-btn.active{
  background:var(--surface);
  color:var(--bronze-deep);
  box-shadow:var(--shadow-sm);
}
.tab-content{animation:reveal .4s var(--ease) both;}

/* ============ TABLES ============ */
.mini-table{
  width:100%;border-collapse:separate;border-spacing:0;
  font-size:14px;
  background:var(--surface);
  border-radius:10px;overflow:hidden;
  border:1px solid var(--border);
  margin:8px 0;
  box-shadow:var(--shadow-sm);
}
.mini-table th{
  padding:12px 16px;text-align:left;
  font-family:var(--mono);font-size:9.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--bronze-deep);background:var(--surface-3);
  border-bottom:1px solid var(--border);
}
.mini-table td{
  padding:14px 16px;
  border-top:1px solid var(--border);
  color:var(--ink-2);line-height:1.6;
  vertical-align:top;
}
.mini-table tr:first-child td{border-top:none;}
.mini-table td:first-child{font-weight:500;color:var(--ink);}

/* ============ CALLOUTS ============ */
.callout{
  padding:18px 22px;border-radius:8px;
  font-size:14px;line-height:1.65;
  margin:20px 0;
  border-left:2px solid var(--bronze);
  background:var(--bronze-tint);
  color:var(--ink-2);
  position:relative;
}
.callout p:last-child{margin-bottom:0;}
.callout b,.callout strong{color:var(--ink);}
.callout-teal{
  border-color:var(--teal);
  background:var(--teal-tint);
}
.callout-rose{
  border-color:var(--rose);
  background:var(--rose-tint);
}
.callout-emerald{
  border-color:var(--emerald);
  background:var(--emerald-tint);
}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:7px;
  font-family:var(--sans);font-size:13.5px;font-weight:500;
  letter-spacing:-.005em;
  transition:all .3s var(--ease);
  white-space:nowrap;position:relative;
}
.btn-primary{
  color:var(--bg);
  background:var(--ink);
  box-shadow:
    0 1px 0 rgba(255,255,255,.12) inset,
    0 8px 20px rgba(28,24,20,.18);
}
.btn-primary:hover{
  transform:translateY(-1px);
  background:#000;
  box-shadow:
    0 1px 0 rgba(255,255,255,.15) inset,
    0 12px 28px rgba(28,24,20,.24);
}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{
  background:var(--ink-5);color:var(--ink-3);
  box-shadow:none;cursor:not-allowed;transform:none;
}
.btn-secondary{
  background:var(--surface);
  border:1px solid var(--border-2);
  color:var(--ink);
  box-shadow:var(--shadow-sm);
}

}

.quiz-option:nth-child(3){animation-delay:.11s;}
.quiz-option:nth-child(4){animation-delay:.15s;}
.quiz-option:hover:not(:disabled){

  color:var(--ink);
  transform:translateX(3px);
  box-shadow:var(--shadow);
}
.quiz-option:disabled{cursor:default;}
.quiz-option .letter{
  width:26px;height:26px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;

  border:1px solid var(--border);

  border-radius:6px;font-family:var(--mono);
  font-weight:500;font-size:11px;
  transition:all .25s var(--ease);
}
.quiz-option:hover:not(:disabled) .letter{

  color:var(--bronze-deep);
}
.quiz-option.correct{

}

}
.quiz-option.wrong{

}
.quiz-option.wrong .letter{
  background:var(--rose);color:#fff;border-color:var(--rose);
}
@keyframes shake{
  0%,100%{transform:translateX(0);}

  40%{transform:translateX(6px);}
  60%{transform:translateX(-3px);}
  80%{transform:translateX(3px);}
}
.quiz-feedback{

}
.quiz-feedback.show{display:block;animation:reveal .3s var(--ease) both;}
.quiz-feedback.ok{

}
.quiz-feedback.ok b{color:var(--emerald);}
.quiz-feedback.no{
  border-color:var(--rose);
  background:var(--rose-tint);
}

.score-display{text-align:center;padding:40px 0 32px;}

}

}
.score-pct{

}
.score-msg{

/* ============ MODAL ============ */
.modal{

}
.modal.show{display:flex;animation:modalFade .3s var(--ease) both;}
@keyframes modalFade{from{opacity:0;}to{opacity:1;}}
.modal-card{

}

.modal-card::-webkit-scrollbar{width:8px;}

const ETIMOLOGI = [
  { key:'arab', label:'Arab · Syajaratun', content:`<p><b>Syajaratun (شجرة)</b> — berarti <em>pohon</em>.</p><p>Kata ini mengandung makna mendalam: seperti pohon yang memiliki <b>akar</b> (asal-usul), <b>batang</b> (intisari), <b>cabang</b> (peristiwa besar), dan <b>ranting</b> (kejadian kecil yang saling terkait). Sejarah dipandang sebagai sebuah <b>silsilah</b> yang terus tumbuh dan bercabang.</p><p><b>Contoh:</b> Silsilah raja-raja Mataram, pohon keluarga nenek moyang, atau evolusi dinasti.</p><p><b>Implikasi:</b> Sejarah tidak pernah berdiri sendiri — selalu terhubung antara masa lalu, kini, dan masa depan.</p>` },
  { key:'inggris', label:'Inggris · History', content:`<p><b>History</b> — dari Yunani <em>historia</em> = <b>pengetahuan yang diperoleh melalui penyelidikan</b>.</p><p>Dalam tradisi Yunani kuno, <em>historia</em> merujuk pada kegiatan bertanya, mengumpulkan informasi, dan menyusunnya menjadi narasi bermakna. Ini menekankan bahwa sejarah adalah hasil <b>proses penelitian dan interpretasi</b>, bukan sekadar fakta mentah.</p><p><b>Contoh:</b> Herodotus (Bapak Sejarah) menulis tentang Perang Yunani-Persia dengan mengumpulkan kesaksian dari berbagai sumber.</p><p><b>Implikasi:</b> Sejarah sebagai ilmu menuntut metode kritis dan verifikasi data.</p>` },

function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('backdrop');
  sb.classList.toggle('open');
  if(sb.classList.contains('open')){
    bd.style.display='block';
    requestAnimationFrame(()=>bd.classList.add('show'));
  } else {
    bd.classList.remove('show');
    setTimeout(()=>bd.style.display='none', 300);
  }
}

function renderSidebar(){
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = `<div class="nav-label">Chapter</div>` +
    App.chapters.map((ch,i)=>{
      const active = i === App.currentChapter;
      const visited = App.visited.has(i) && !active;
      return `<button class="chapter-link ${active?'active':''} ${visited?'visited':''}" onclick="goToChapter(${i})">
        <span class="chapter-num">${ch.num}</span>
        <span class="chapter-name">${ch.short}</span>
        <span class="chapter-check">✓</span>
      </button>`;
    }).join('');
}

function updateProgress(){
  const total = App.chapters.length;
  const visited = App.visited.size;
  const pct = Math.round(visited / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${visited} / ${total}`;
  document.getElementById('mobileProgress').textContent = `${String(App.currentChapter).padStart(2,'0')} / 07`;
  document.getElementById('mobileTitle').textContent = App.chapters[App.currentChapter].short;
}

function goToChapter(idx){
  if(idx < 0 || idx >= App.chapters.length) return;
  App.currentChapter = idx;
  App.visited.add(idx);
  renderSidebar();
  updateProgress();
  if(window.innerWidth <= 900){
    const sb = document.getElementById('sidebar');
    if(sb.classList.contains('open')) toggleSidebar();
  }
  const content = document.getElementById('content');
  content.innerHTML = CHAPTERS[idx].render();
  document.getElementById('main').scrollTop = 0;
  if(CHAPTERS[idx].setup) setTimeout(()=>CHAPTERS[idx].setup(), 50);
}

function openModal(html){
  const card = document.getElementById('modalCard');
  card.innerHTML = `<button class="modal-close" onclick="closeModal()" aria-label="Tutup">✕</button>` + html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeModal();
  if(document.getElementById('modal').classList.contains('show')) return;
  if(e.key === 'ArrowRight' && App.currentChapter < 7) goToChapter(App.currentChapter + 1);
  if(e.key === 'ArrowLeft' && App.currentChapter > 0) goToChapter(App.currentChapter - 1);
});

function chapterNav(prevIdx, nextIdx, nextLabel='Selanjutnya'){
  return `<div class="chapter-nav-bottom">
    ${prevIdx !== null ? `<button class="btn btn-secondary" onclick="goToChapter(${prevIdx})">← Sebelumnya</button>` : '<span></span>'}
    ${nextIdx !== null ? `<button class="btn btn-primary" onclick="goToChapter(${nextIdx})">${nextLabel} →</button>` : ''}
  </div>`;
}

function downloadText(text, filename){
  const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function renderQuiz(){
  const qs = App.quiz;
  const root = document.getElementById('quizRoot');
  if(!root) return;

  if(qs.idx >= QUIZ.length){ renderQuizResult(); return; }

  const q = QUIZ[qs.idx];
  const pct = Math.round(qs.idx / QUIZ.length * 100);
  const typeLabel = q.t === 'pg' ? 'Pilihan Ganda' : 'Benar / Salah';

  let optionsHtml = '';
  if(q.t === 'pg'){
    const letters = ['A','B','C','D'];
    optionsHtml = q.o.map((opt,i)=>`
      <button class="quiz-option" data-idx="${i}">
        <span class="letter">${letters[i]}</span>
        <span>${opt}</span>
      </button>`).join('');
  } else {
    optionsHtml = ['BENAR','SALAH'].map((opt,i)=>`
      <button class="quiz-option" data-idx="${i}">
        <span class="letter">${i===0?'B':'S'}</span>
        <span>${opt}</span>
      </button>`).join('');
  }

  root.innerHTML = `
    <section class="hero">
      <div class="hero-eyebrow">
        <span class="chip chip-gold">Chapter 07</span>
        <span class="hero-eyebrow-line"></span>
        <span class="hero-meta">Tantangan Akhir</span>
      </div>
      <h1 class="hero-title">Tantangan <span class="accent">Akhir</span></h1>
      <p class="hero-body">Uji pemahamanmu tentang prinsip ilmu sejarah.</p>
    </section>

    <section class="section">
      <div class="quiz-header">
        <div class="quiz-progress">
          Soal
          <strong>${qs.idx + 1} <span>/ ${QUIZ.length}</span></strong>
        </div>
        <div class="quiz-score">
          Benar <strong>${qs.correct}</strong>
        </div>
      </div>
      <div class="progress-track" style="margin-bottom:32px;"><div class="progress-fill" style="width:${pct}%;"></div></div>

      <div class="quiz-type">${typeLabel}</div>
      <p class="quiz-question">${q.q}</p>
      <div id="quizOptions">${optionsHtml}</div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div class="btn-row" id="quizAfter"></div>
    </section>
  `;

  document.querySelectorAll('#quizOptions .quiz-option').forEach(btn=>{
    btn.onclick = ()=> answerQuestion(parseInt(btn.dataset.idx), btn);
  });
}

function answerQuestion(picked, btn){
  const qs = App.quiz;
  const q = QUIZ[qs.idx];
  const all = document.querySelectorAll('#quizOptions .quiz-option');
  all.forEach(o=>o.disabled = true);

  const fb = document.getElementById('quizFeedback');
  const isCorrect = picked === q.c;

  if(isCorrect){
    btn.classList.add('correct');
    qs.correct++;
    fb.className = 'quiz-feedback ok show';
    fb.innerHTML = `<b>✓ Benar.</b> ${q.e}`;
  } else {
    btn.classList.add('wrong');
    all[q.c].classList.add('correct');
    fb.className = 'quiz-feedback no show';
    fb.innerHTML = `<b>✗ Belum tepat.</b> ${q.e}`;
  }
  qs.answered.push({ picked, correct: isCorrect });
  qs.idx++;

  const after = document.getElementById('quizAfter');
  const nb = document.createElement('button');
  nb.className = 'btn btn-primary';
  nb.innerHTML = qs.idx < QUIZ.length ? 'Soal Berikutnya →' : 'Lihat Hasil →';
  nb.onclick = ()=> renderQuiz();
  after.appendChild(nb);
}

window.showReview = ()=>{
  const qs = App.quiz;
  let html = '<span class="modal-tag">Pembahasan</span><h3>Pembahasan Lengkap</h3>';
  QUIZ.forEach((q,i)=>{
    const a = qs.answered[i];
    let answer;
    if(q.t === 'pg') answer = `${String.fromCharCode(65+q.c)}. ${q.o[q.c]}`;
    else answer = q.c === 0 ? 'BENAR' : 'SALAH';
    const ok = a?.correct;
    html += `
      <div style="margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border);">
        <p style="font-weight:500;color:var(--ink);margin:0 0 8px;line-height:1.5;">${i+1}. [${q.t.toUpperCase()}] ${q.q}</p>
        <p style="font-size:13px;color:${ok?'var(--emerald)':'var(--bronze-deep)'};margin:0 0 4px;font-weight:500;">
          ${ok?'✓':'○'} Jawaban benar: ${answer}
        </p>
        <p style="font-size:13px;color:var(--ink-3);margin:0;line-height:1.65;">${q.e}</p>
      </div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="closeModal()">Tutup</button></div>`;
  openModal(html);
};
